<style>
:root{
  --bg:#fdf6f3;--card:#ffffff;--ink:#2b1d24;--muted:#7d6b73;--accent:#a63d62;--accent2:#7a2e4a;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:linear-gradient(180deg,var(--glow) 0,var(--bg) 240px) no-repeat,var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:28px;margin:8px 0 2px;color:var(--accent2)}
h2{font-size:20px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(122,46,74,.06)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.small{padding:6px 10px;font-size:14px}
button:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:transparent;color:var(--muted);border-radius:0;padding:10px 2px;font-size:12px}
nav button.on{color:var(--accent);font-weight:600}
nav button span{display:block;font-size:20px}
.entry{border-top:1px solid var(--line);padding:12px 0}
.entry:first-child{border-top:0}
.entry p{margin:0 0 6px;white-space:pre-wrap;word-break:break-word}
.meta{font-size:12px;color:var(--muted)}
.done p{text-decoration:line-through;color:var(--muted)}
.msg{padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
.msg.err{background:#fdecea;color:#8a1f14}
.msg.ok{background:#e6f5ec;color:#1d5c3a}
.big{font-size:18px}
.hidden{display:none}
.seg{display:flex;gap:6px;margin:8px 0;overflow-x:auto}

.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.netbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.dot{width:10px;height:10px;border-radius:50%;background:#aaa;flex:none}
.dot.on{background:var(--ok)}.dot.wait{background:#e0a100}
.pings{display:flex;gap:8px;margin:6px 0}
.pings button{background:var(--card);border:1px solid var(--line);font-size:22px;padding:6px 14px}
.code{font-size:24px;letter-spacing:2px;font-weight:700;text-align:center;margin:8px 0;word-break:break-all}
.chat{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow-y:auto;padding:4px}
.chat:empty::before{content:"Say salam \1F44B";color:var(--muted)}
.b{max-width:80%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.b small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.b.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.b.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:14px;text-align:left;border-radius:16px}
.gcard .em{font-size:28px}
.gcard small{color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:12px auto}
.cell{aspect-ratio:1;font-size:38px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:0}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:360px;margin:12px auto;background:#2f4fa8;padding:6px;border-radius:12px}
.c4cell{aspect-ratio:1;border-radius:50%;background:#fff;border:0;padding:0}
.c4cell.R{background:#e53935}.c4cell.Y{background:#fdd835}
.opt{display:block;width:100%;margin:8px 0;padding:14px;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#2b1d24;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.rit{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rit:first-of-type{border-top:0}
.rit .t{flex:1}
.tick{width:34px;height:34px;border-radius:50%;padding:0;background:transparent;border:2px solid var(--accent);color:#fff}
.tick.on{background:var(--ok);border-color:var(--ok)}
.cv{display:block;width:100%;aspect-ratio:4/3;background:#fff;border-radius:12px;border:1px solid var(--line);touch-action:none}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.banner{background:#fff4d6;color:#6b4e00;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:8px}

<script>
(function(){
'use strict';

const LS_KEY='humtum_vault_v1';
const ITER=600000;
const enc=new TextEncoder(), dec=new TextDecoder();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);};
const unb64=s=>{const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=x=>{x=parseInt(x,10);return (x>=0&&x<100000)?x:0;};
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayKey=()=>dateKey(new Date());
function dayIndex(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh'}).format(new Date()).split('-').map(Number);return Math.floor((Date.UTC(p[0],p[1]-1,p[2])-Date.UTC(p[0],0,0))/864e5);}
function fmt(ts){try{return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function range(n){const r=[];for(let i=0;i<n;i++)r.push(i);return r;}
function cleanName(n){return String(n||'').replace(/[\u0000-\u001f]/g,'').trim().slice(0,30);}

// ==== NET BEGIN ====
// Encrypted relay over several free public MQTT-over-WebSocket servers.
// Both phones use the same secret code -> same hidden topic + same AES key.
const DEFAULT_BROKERS=[
 'wss://broker.emqx.io:8084/mqtt',
 'wss://broker.hivemq.com:8884/mqtt',
 'wss://mqtt.eclipseprojects.io:443/mqtt',
 'wss://test.mosquitto.org:8081',
 'wss://broker-cn.emqx.io:8084/mqtt'
];
const _enc=new TextEncoder(),_dec=new TextDecoder();
const toHex=u=>Array.from(u,b=>b.toString(16).padStart(2,'0')).join('');
const rndHex=n=>toHex(crypto.getRandomValues(new Uint8Array(n)));
function cat(arrs){let n=0;arrs.forEach(a=>{n+=a.length;});const o=new Uint8Array(n);let p=0;arrs.forEach(a=>{o.set(a,p);p+=a.length;});return o;}
function mqStr(s){const b=_enc.encode(s);return cat([Uint8Array.of(b.length>>8,b.length&255),b]);}
function mqLen(n){const a=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d);}while(n>0);return Uint8Array.from(a);}
function mqPacket(first,parts){const body=cat(parts);return cat([Uint8Array.of(first),mqLen(body.length),body]);}
function normSecret(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');}

function makeLink(url,topic,cb){
  const L={url:url,state:'connecting',tries:0};
  let ws=null,buf=new Uint8Array(0),timer=null,ping=null,dog=null,lastRx=0,stopped=false,subscribed=false;
  const cid='ht-'+rndHex(6);
  function setState(s){if(L.state!==s){L.state=s;cb.state(L);}}
  function clean(){clearTimeout(timer);clearInterval(ping);clearInterval(dog);timer=ping=dog=null;}
  function sendRaw(u){try{if(ws&&ws.readyState===1)ws.send(u);}catch(e){}}
  function open(){
    if(stopped)return;
    clean();buf=new Uint8Array(0);subscribed=false;
    setState('connecting');
    let mine;
    try{mine=new WebSocket(url,'mqtt');}catch(e){fail();return;}
    ws=mine;
    mine.binaryType='arraybuffer';
    timer=setTimeout(()=>{if(ws===mine&&!subscribed){try{mine.close();}catch(e){}}},12000);
    mine.onopen=()=>{
      if(ws!==mine)return;
      lastRx=Date.now();
      sendRaw(mqPacket(0x10,[mqStr('MQTT'),Uint8Array.of(4,2,0,30),mqStr(cid)]));
    };
    mine.onmessage=ev=>{
      if(ws!==mine)return;
      lastRx=Date.now();
      try{feed(new Uint8Array(ev.data));}catch(e){try{mine.close();}catch(_){}}
    };
    mine.onclose=()=>{if(ws!==mine)return;ws=null;fail();};
    mine.onerror=()=>{};
  }
  function fail(){
    clean();subscribed=false;
    if(stopped)return;
    setState('down');
    L.tries++;
    timer=setTimeout(open,Math.min(1000*Math.pow(1.6,L.tries-1),15000));
  }
  function feed(chunk){
    buf=cat([buf,chunk]);
    for(;;){
      if(buf.length<2)return;
      let mult=1,len=0,i=1,b;
      for(;;){
        if(i>=buf.length)return;
        b=buf[i++];len+=(b&127)*mult;mult*=128;
        if(!(b&128))break;
        if(mult>2097152)throw new Error('bad length');
      }
      if(buf.length<i+len)return;
      const type=buf[0]>>4,flags=buf[0]&15,body=buf.slice(i,i+len);
      buf=buf.slice(i+len);
      pkt(type,flags,body);
    }
  }
  function pkt(type,flags,body){
    if(type===2){
      if(body[1]!==0){if(ws)try{ws.close();}catch(e){}return;}
      sendRaw(mqPacket(0x82,[Uint8Array.of(0,1),mqStr(topic),Uint8Array.of(0),mqStr(topic+'/mail/#'),Uint8Array.of(0)]));
    }else if(type===9){
      if(body[2]===0x80){if(ws)try{ws.close();}catch(e){}return;}
      if(!subscribed){
        subscribed=true;L.tries=0;clearTimeout(timer);
        ping=setInterval(()=>sendRaw(Uint8Array.of(0xC0,0)),15000);
        dog=setInterval(()=>{if(Date.now()-lastRx>45000&&ws){try{ws.close();}catch(e){}}},5000);
        setState('online');
      }
    }else if(type===3){
      const qos=(flags>>1)&3,tl=(body[0]<<8)|body[1];
      let p=2+tl;if(qos>0)p+=2;
      cb.data(body.slice(p),L,_dec.decode(body.slice(2,2+tl)));
    }
  }
  L.start=open;
  L.publish=bytes=>{if(L.state==='online')sendRaw(mqPacket(0x30,[mqStr(topic),bytes]));};
  L.mail=(bytes,id)=>{if(L.state==='online')sendRaw(mqPacket(0x31,[mqStr(topic+'/mail/'+id),bytes]));};
  L.kick=()=>{
    if(stopped)return;
    if(L.state==='online'&&Date.now()-lastRx<20000)return;
    clean();
    if(ws){const w=ws;ws=null;try{w.close();}catch(e){}}
    L.tries=0;open();
  };
  L.stop=()=>{stopped=true;clean();if(ws){const w=ws;ws=null;try{w.close();}catch(e){}}};
  return L;
}

function createNet(cb,brokers){
  brokers=brokers||DEFAULT_BROKERS;
  const me=cb.deviceId,boot=rndHex(3);
  let room=null,links=[],seq=0,seen=new Set(),seenQ=[],inq=Promise.resolve(),outq=Promise.resolve(),hbT=null,chkT=null,gen=0,myName='';
  const partner={id:null,name:'',boot:'',seen:0,online:false};
  async function deriveRoom(secret){
    const norm=normSecret(secret);
    if(norm.length<8)throw new Error('short');
    const base=await crypto.subtle.importKey('raw',_enc.encode(norm),'PBKDF2',false,['deriveBits']);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:_enc.encode('humtum-room-v2'),iterations:150000,hash:'SHA-256'},base,384));
    const key=await crypto.subtle.importKey('raw',bits.slice(16,48),'AES-GCM',false,['encrypt','decrypt']);
    const topic=toHex(bits.slice(0,16));
    return {topic:topic,key:key,rid:topic.slice(0,4).toUpperCase()};
  }
  async function seal(key,obj){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,_enc.encode(JSON.stringify(obj))));
    return cat([iv,ct]);
  }
  async function unseal(key,bytes){
    if(bytes.length<29)return null;
    try{
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));
      return JSON.parse(_dec.decode(pt));
    }catch(e){return null;}
  }
  function resetPartner(){partner.id=null;partner.name='';partner.boot='';partner.seen=0;partner.online=false;}
  function send(obj){
    const r=room;if(!r)return;
    outq=outq.then(async()=>{
      if(room!==r)return;
      const bytes=await seal(r.key,{i:me,b:boot,n:++seq,m:obj});
      links.forEach(l=>l.publish(bytes));
    }).catch(()=>{});
  }
  function onLink(l){
    if(cb.links)cb.links();
    if(l.state==='online')send({t:'hi',name:myName,boot:boot});
  }
  function onRaw(bytes,_l,tp){
    const r=room;if(!r)return;
    inq=inq.then(async()=>{
      const env=await unseal(r.key,bytes);
      if(!env||room!==r||typeof env!=='object'||typeof env.i!=='string')return;
      if(env.i===me)return;
      if(tp&&tp.indexOf('/mail/')>-1){if(env.m&&env.m.t==='mail'&&cb.mail)cb.mail(env.m.msgs);return;}
      const k=env.i+':'+env.b+':'+env.n;
      if(seen.has(k))return;
      seen.add(k);seenQ.push(k);
      if(seenQ.length>800)seen.delete(seenQ.shift());
      handle(env);
    }).catch(()=>{});
  }
  function handle(env){
    const m=env.m;
    if(!m||typeof m!=='object')return;
    const t=Date.now();
    if(partner.id!==env.i){
      if(partner.id===null||t-partner.seen>8000||m.t==='hi'){partner.id=env.i;partner.boot='';partner.online=false;}
      else return;
    }
    partner.seen=t;
    if(m.t==='hi'||m.t==='hb'){
      const nm=String(m.name||'').replace(/[\u0000-\u001f]/g,'').trim().slice(0,30);
      if(nm)partner.name=nm;
      const nb=String(m.boot||'').slice(0,12);
      const bootChanged=!!nb&&nb!==partner.boot;
      if(nb)partner.boot=nb;
      if(m.t==='hi'&&!m.re)send({t:'hi',re:1,name:myName,boot:boot});
      const was=partner.online;partner.online=true;
      if(!was||bootChanged)cb.partner(true,bootChanged&&was);
      return;
    }
    if(!partner.online){partner.online=true;cb.partner(true,false);}
    cb.msg(m);
  }
  function check(){
    if(partner.online&&Date.now()-partner.seen>16000){partner.online=false;cb.partner(false,false);}
  }
  function stop(){
    gen++;
    clearInterval(hbT);clearInterval(chkT);hbT=chkT=null;
    links.forEach(l=>l.stop());links=[];
    const was=partner.online;
    room=null;resetPartner();
    if(was)cb.partner(false,false);
    if(cb.links)cb.links();
  }
  async function start(secret,name){
    stop();
    const g=++gen;
    myName=name||'';
    const r=await deriveRoom(secret);
    if(g!==gen)return false;
    room=r;
    links=brokers.map(u=>makeLink(u,'humtum2/'+r.topic,{state:onLink,data:onRaw}));
    links.forEach(l=>l.start());
    hbT=setInterval(()=>send({t:'hb',name:myName,boot:boot}),5000);
    chkT=setInterval(check,2000);
    if(cb.links)cb.links();
    return true;
  }
  function kick(){links.forEach(l=>l.kick());send({t:'hi',name:myName,boot:boot});}
  function postMail(msgs){const r=room;if(!r)return;outq=outq.then(async()=>{if(room!==r)return;const bytes=await seal(r.key,{i:me,b:boot,n:++seq,m:{t:'mail',msgs:msgs}});links.forEach(l=>l.mail(bytes,me));}).catch(()=>{});}
  return {
    start:start,stop:stop,send:send,kick:kick,norm:normSecret,mail:postMail,
    active:()=>!!room,
    online:()=>partner.online,
    partnerName:()=>partner.name,
    role:()=>partner.id?(me<partner.id?'host':'guest'):null,
    setName:n=>{myName=n||'';},
    info:()=>({rid:room?room.rid:'',up:links.filter(l=>l.state==='online').length,
      links:links.map(l=>({url:l.url,state:l.state})),
      partner:{id:partner.id,name:partner.name,online:partner.online,seen:partner.seen}})
  };
}
// ==== NET END ====

// ---------- vault crypto ----------
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
let pq=Promise.resolve();
function persist(){pq=pq.then(persistNow).catch(()=>{});return pq;}
async function persistNow(){
  if(!state.key||!state.data)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},state.key,enc.encode(JSON.stringify(state.data)));
  localStorage.setItem(LS_KEY,JSON.stringify({v:1,iter:state.iter,salt:b64(state.salt),iv:b64(iv),ct:b64(ct)}));
}
async function decryptRecord(rec,pass){
  const salt=unb64(rec.salt);
  const key=await deriveKey(pass,salt,rec.iter);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},key,unb64(rec.ct));
  return {key:key,salt:salt,iter:rec.iter,data:Object.assign(emptyData(),JSON.parse(dec.decode(pt)))};
}
async function createVault(pass){
  state.salt=crypto.getRandomValues(new Uint8Array(16));
  state.iter=ITER;
  state.key=await deriveKey(pass,state.salt,state.iter);
  state.data=emptyData();
  await persist();
}
function validRecord(r){
  return r&&r.v===1&&typeof r.salt==='string'&&typeof r.iv==='string'&&typeof r.ct==='string'&&typeof r.iter==='number'&&r.iter>=100000&&r.iter<=2000000;
}
function getRecord(){try{const r=JSON.parse(localStorage.getItem(LS_KEY));return validRecord(r)?r:null;}catch(e){return null;}}

// ---------- incoming messages ----------
function cleanAns(id,v){
  const dk=DECKS[id];if(!dk||v===null||v===undefined)return null;
  if(dk.type==='choice')return (v===0||v===1)?v:null;
  if(dk.type==='yom')return (v==='host'||v==='guest')?v:null;
  if(dk.type==='text')return (typeof v==='string'&&v.trim())?v.slice(0,500):null;
  if(dk.type==='guess'){if(v&&(v.own===0||v.own===1)&&(v.guess===0||v.guess===1))return {own:v.own,guess:v.guess};return null;}
  return null;
}
function cleanGame(g){
  if(!g||typeof g!=='object')return null;
  const id=g.id;
  if(id==='ttt'){
    if(!Array.isArray(g.board)||g.board.length!==9)return null;
    const w=g.wins||{};
    return {id:id,board:g.board.map(c=>(c==='X'||c==='O')?c:''),turn:g.turn==='O'?'O':'X',
      winner:(g.winner==='X'||g.winner==='O'||g.winner==='draw')?g.winner:null,starter:g.starter==='O'?'O':'X',wins:{X:num(w.X),O:num(w.O)}};
  }
  if(id==='c4'){
    if(!Array.isArray(g.grid)||g.grid.length!==42)return null;
    const w=g.wins||{};
    return {id:id,grid:g.grid.map(c=>(c==='R'||c==='Y')?c:''),turn:g.turn==='Y'?'Y':'R',
      winner:(g.winner==='R'||g.winner==='Y'||g.winner==='draw')?g.winner:null,starter:g.starter==='Y'?'Y':'R',wins:{R:num(w.R),Y:num(w.Y)}};
  }
  if(id==='tod'){
    const kind=(g.kind==='truth'||g.kind==='dare')?g.kind:null;
    let i=parseInt(g.i,10)||0;const len=kind==='dare'?DARES.length:TRUTHS.length;if(i<0||i>=len)i=0;
    return {id:id,kind:kind,i:i};
  }
  if(id==='draw')return {id:id};
  if(id==='qz'){
    const phase=(g.phase==='answer'||g.phase==='done')?g.phase:'ask';
    const opts=Array.isArray(g.opts)?g.opts.slice(0,4).map(o=>String(o).slice(0,80)):[];
    let correct=parseInt(g.correct,10)||0;if(correct<0||correct>=opts.length)correct=0;
    let pick=(g.pick===null||g.pick===undefined)?null:parseInt(g.pick,10);
    if(pick!==null&&!(pick>=0&&pick<opts.length))pick=null;
    const s=g.score||{};
    return {id:id,by:g.by==='guest'?'guest':'host',phase:opts.length<2?'ask':phase,n:num(g.n)||1,q:String(g.q||'').slice(0,150),
      opts:opts,correct:correct,pick:pick,score:{host:num(s.host),guest:num(s.guest)}};
  }
  const dk=DECKS[id];
  if(dk){
    const n=dk.cards.length;
    if(!Array.isArray(g.order)||g.order.length!==n)return null;
    const order=g.order.map(x=>{x=parseInt(x,10);return (x>=0&&x<n)?x:0;});
    let pos=parseInt(g.pos,10)||0;if(pos<0||pos>=n)pos=0;
    const a=g.ans||{},s=g.score||{};
    return {id:id,order:order,pos:pos,ans:{host:cleanAns(id,a.host),guest:cleanAns(id,a.guest)},score:{host:num(s.host),guest:num(s.guest)}};
  }
  return null;
}
function onData(m){
  const d=state.data;
  if(m.t==='chat'){
    const txt=String(m.text||'').slice(0,2000);if(txt){addChat('them',txt,typeof m.id==='string'?m.id.slice(0,24):undefined);}
  }else if(m.t==='ping'){
    toast(pname()+' sent '+(PINGS.indexOf(m.e)>-1?m.e:PINGS[0]));buzz();
  }else if(m.t==='gs'){
    const g=cleanGame(m.g);if(!g)return;
    if(m.sync&&state.game)return;
    if(g.id==='draw'&&(!state.game||state.game.id!=='draw'))state.strokes=[];
    state.game=g;state.gtmp=null;state.draft='';gameChanged();
  }else if(m.t==='ans'){
    const g=state.game;
    if(!g||!DECKS[g.id]||m.pos!==g.pos)return;
    const v=cleanAns(g.id,m.val);if(v===null)return;
    g.ans[otherRole()]=v;gameChanged();
  }else if(m.t==='next'){
    const g=state.game;
    if(g&&DECKS[g.id]&&m.pos===g.pos&&g.ans.host!==null&&g.ans.guest!==null)nextRound();
  }else if(m.t==='gc'){
    state.game=null;state.gtmp=null;gameChanged();
  }else if(m.t==='dr'){
    if(!Array.isArray(m.s))return;
    m.s.slice(0,300).forEach(s=>{
      if(!Array.isArray(s)||s.length!==5)return;
      const a=s.map(Number);
      for(let i=0;i<4;i++){if(!(a[i]>=0&&a[i]<=1))return;}
      if(!(a[4]>=0&&a[4]<DCOLS.length)||a[4]%1!==0)return;
      state.strokes.push(a);
      if(state.strokes.length>8000)state.strokes.shift();
      if(state.drawSeg)state.drawSeg(a);
    });
  }else if(m.t==='dc'){
    state.strokes=[];if(state.drawClear)state.drawClear();
  }else if(m.t==='qzp'){
    const g=state.game;
    if(!g||g.id!=='qz'||g.phase!=='answer'||m.n!==g.n)return;
    const i=parseInt(m.i,10);if(!(i>=0&&i<g.opts.length))return;
    applyPick(i,otherRole());gameChanged();
  }else if(m.t==='qzn'){
    const g=state.game;
    if(g&&g.id==='qz'&&g.phase==='done'&&m.n===g.n)qzNext();
  }
}

// ---------- games ----------
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function setGame(g){state.game=g;state.gtmp=null;state.draft='';sendMsg({t:'gs',g:g});gameChanged();}
function startGame(id){
  if(!connected()||!myRole())return;
  if(id==='ttt')setGame({id:'ttt',board:Array(9).fill(''),turn:'X',winner:null,starter:'X',wins:{X:0,O:0}});
  else if(id==='c4')setGame({id:'c4',grid:Array(42).fill(''),turn:'R',winner:null,starter:'R',wins:{R:0,Y:0}});
  else if(id==='tod')setGame({id:'tod',kind:null,i:0});
  else if(id==='draw'){state.strokes=[];setGame({id:'draw'});}
  else if(id==='qz'){state.qzd={q:'',o:['','','',''],c:-1};setGame({id:'qz',by:myRole(),phase:'ask',n:1,q:'',opts:[],correct:0,pick:null,score:{host:0,guest:0}});}
  else if(DECKS[id])setGame({id:id,order:shuffle(range(DECKS[id].cards.length)),pos:0,ans:{host:null,guest:null},score:{host:0,guest:0}});
}
function tttMove(i){
  const g=state.game;if(!g||g.id!=='ttt'||g.winner||g.board[i])return;
  const mark=myRole()==='host'?'X':'O';if(g.turn!==mark)return;
  g.board[i]=mark;
  let w=null;LINES.forEach(l=>{if(g.board[l[0]]&&g.board[l[0]]===g.board[l[1]]&&g.board[l[1]]===g.board[l[2]])w=g.board[l[0]];});
  if(w){g.winner=w;g.wins[w]++;}else if(g.board.every(Boolean))g.winner='draw';else g.turn=mark==='X'?'O':'X';
  setGame(g);
}
function tttAgain(){
  const g=state.game;if(!g||g.id!=='ttt')return;
  const s=g.starter==='X'?'O':'X';
  setGame({id:'ttt',board:Array(9).fill(''),turn:s,winner:null,starter:s,wins:g.wins});
}
function c4win(grid,r,c,m){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let k=0;k<4;k++){
    let n=1;
    for(let s=-1;s<=1;s+=2){
      let rr=r+dirs[k][0]*s,cc=c+dirs[k][1]*s;
      while(rr>=0&&rr<6&&cc>=0&&cc<7&&grid[rr*7+cc]===m){n++;rr+=dirs[k][0]*s;cc+=dirs[k][1]*s;}
    }
    if(n>=4)return true;
  }
  return false;
}
function c4Drop(c){
  const g=state.game;if(!g||g.id!=='c4'||g.winner)return;
  const mark=myRole()==='host'?'R':'Y';if(g.turn!==mark)return;
  let r=-1;for(let i=5;i>=0;i--){if(!g.grid[i*7+c]){r=i;break;}}
  if(r<0)return;
  g.grid[r*7+c]=mark;
  if(c4win(g.grid,r,c,mark)){g.winner=mark;g.wins[mark]++;}
  else if(g.grid.every(Boolean))g.winner='draw';
  else g.turn=mark==='R'?'Y':'R';
  setGame(g);
}
function c4Again(){
  const g=state.game;if(!g||g.id!=='c4')return;
  const s=g.starter==='R'?'Y':'R';
  setGame({id:'c4',grid:Array(42).fill(''),turn:s,winner:null,starter:s,wins:g.wins});
}
function answer(v){
  const g=state.game,me=myRole();if(!g||!DECKS[g.id]||!me||g.ans[me]!==null)return;
  g.ans[me]=v;
  sendMsg({t:'ans',pos:g.pos,val:v});
  gameChanged();
}
function nextRound(){
  const g=state.game;if(!g||!DECKS[g.id])return;
  if(g.id==='guess'&&g.ans.host&&g.ans.guest){
    if(g.ans.host.guess===g.ans.guest.own)g.score.host++;
    if(g.ans.guest.guess===g.ans.host.own)g.score.guest++;
  }
  g.pos=(g.pos+1)%g.order.length;
  g.ans={host:null,guest:null};
  state.gtmp=null;state.draft='';
  gameChanged();
}
function applyPick(i,who){
  const g=state.game;
  g.pick=i;g.phase='done';
  if(i===g.correct)g.score[who]++;
}
function qzNext(){
  const g=state.game;if(!g||g.id!=='qz')return;
  g.by=g.by==='host'?'guest':'host';g.phase='ask';g.n++;g.q='';g.opts=[];g.pick=null;g.correct=0;
  state.qzd={q:'',o:['','','',''],c:-1};
  gameChanged();
}
function gameChanged(){if(state.tab==='together'&&state.tsub==='games')updateContent();}

// doodle
let dq=[],dqT=null;
function flushDraw(){dqT=null;while(dq.length)sendMsg({t:'dr',s:dq.splice(0,150)});}
function addSeg(s){
  s=s.map((v,i)=>i<4?Math.round(v*10000)/10000:v);
  state.strokes.push(s);
  if(state.strokes.length>8000)state.strokes.shift();
  dq.push(s);
  if(!dqT)dqT=setTimeout(flushDraw,90);
}
function initCanvas(){
  const cv=$('cv');
  if(!cv){state.drawSeg=null;state.drawClear=null;return;}
  const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(280,cv.clientWidth||320);
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*0.75*dpr);
  const ctx=cv.getContext('2d');
  if(!ctx)return;
  const paint=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);};
  const seg=s=>{
    ctx.strokeStyle=DCOLS[s[4]]||'#000';ctx.lineWidth=(s[4]===5?0.035:0.008)*cv.width;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s[0]*cv.width,s[1]*cv.height);ctx.lineTo(s[2]*cv.width,s[3]*cv.height);ctx.stroke();
  };
  paint();state.strokes.forEach(seg);
  state.drawSeg=seg;state.drawClear=paint;
  let last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];};
  cv.onpointerdown=e=>{
    e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
    last=pos(e);const s=[last[0],last[1],last[0],last[1],state.dcol];seg(s);addSeg(s);
  };
  cv.onpointermove=e=>{
    if(!last)return;
    const p=pos(e),s=[last[0],last[1],p[0],p[1],state.dcol];last=p;seg(s);addSeg(s);
  };
  cv.onpointerup=cv.onpointercancel=cv.onpointerleave=()=>{last=null;};
}

function streak(r){

  if(!r.days[dateKey(d)])d.setDate(d.getDate()-1);

      <label for="np2">Repeat</label><input id="np2" type="password" minlength="8" autocomplete="new-password" required>
      <div class="row" style="margin-top:10px"><button type="submit">Change</button></div></form></div>
    <div class="card"><div class="row"><button class="ghost" data-act="clear-chat">Clear chat history</button><button class="ghost" data-act="lock">Lock now</button></div></div>`;
}
function render(){
  if(!state.key){lockView();return;}
  let h;
  if(state.tab==='today')h=todayView();
  else if(state.tab==='together')h=togetherView();
  else if(state.tab==='journal')h=journalView();
  else h=vaultView();
  $('app').innerHTML=h;
  const nav=$('nav');nav.classList.remove('hidden');
  nav.innerHTML=TABS.map(x=>`<button data-tab="${x[0]}" class="${x[0]===state.tab?'on':''}"><span>${x[1]}</span>${x[2]}</button>`).join('');
  state.msg=null;
  if(state.tab==='together'){
    scrollChat();
    if(state.tsub==='games'&&state.game&&state.game.id==='draw')initCanvas();else{state.drawSeg=null;state.drawClear=null;}
  }else{state.drawSeg=null;state.drawClear=null;}
}

// ---------- events ----------
async function handleSubmit(e){
  const f=e.target;
  if(f.id==='f-create'){
    e.preventDefault();
    const p1=$('p1').value,p2=$('p2').value;
    if(p1!==p2){setMsg('Passphrases match nahi karte.');lockView();return;}
    $('b-create').disabled=true;$('b-create').textContent='Creating...';
    try{await createVault(p1);state.tab='today';render();}catch(err){setMsg('Vault nahi bana: '+err.message);lockView();}
  }else if(f.id==='f-unlock'){
    e.preventDefault();
    $('b-unlock').disabled=true;$('b-unlock').textContent='Unlocking...';
    try{
      const r=await decryptRecord(getRecord(),$('p1').value);
      state.key=r.key;state.salt=r.salt;state.iter=r.iter;state.data=r.data;state.tab='today';
      N.setName(state.data.me||'');
      render();autoStart();
    }catch(err){setMsg('Galat passphrase ya data kharab hai.');lockView();}
  }else if(f.id==='f-change'){
    e.preventDefault();
    const a=$('np1').value,b=$('np2').value;
    if(a!==b){setMsg('New passphrases match nahi karte.');render();return;}
    try{
      state.salt=crypto.getRandomValues(new Uint8Array(16));state.iter=ITER;
      state.key=await deriveKey(a,state.salt,state.iter);await persist();setMsg('Passphrase change ho gaya.','ok');
    }catch(err){setMsg('Passphrase change nahi hua.');}
    render();
  }else if(f.id==='f-connect'){
    e.preventDefault();
    const nm=cleanName(f.elements.me.value),code=f.elements.code.value.trim();
    if(!nm){state.netErr='Apna naam likhein.';refreshNet();return;}
    await startRoom(code,nm);
  }else if(f.id==='f-chat'){
    e.preventDefault();
    const inp=$('chat-in'),txt=inp.value.trim();
    if(!txt||!connected())return;
    const cid=uid();sendMsg({t:'chat',text:txt,id:cid});
    addChat('me',txt,cid);sendMail();
    inp.value='';state.chatDraft='';
  }else if(f.id==='f-deep'){
    e.preventDefault();
    const v=$('deep-in').value.trim();
    if(v){state.draft='';answer(v.slice(0,500));}
  }else if(f.id==='f-qz'){
    e.preventDefault();
    const q=f.elements.q.value.trim();
    const raw=[0,1,2,3].map(i=>f.elements['o'+i].value.trim());
    const c=parseInt(f.elements.c.value,10);
    if(!q){toast('Sawal likhein');return;}
    const idxs=[];raw.forEach((o,i)=>{if(o)idxs.push(i);});
    if(idxs.length<2){toast('Kam se kam 2 options likhein');return;}
    if(!(c>=0&&c<4)||!raw[c]){toast('Sahi option par tick lagayein');return;}
    const g=state.game;
    state.qzd={q:'',o:['','','',''],c:-1};
    setGame({id:'qz',by:myRole(),phase:'answer',n:g.n,q:q,opts:idxs.map(i=>raw[i]),correct:idxs.indexOf(c),pick:null,score:g.score});
  }else if(f.dataset.form==='dates'){
    e.preventDefault();const ok=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';
    state.data.since=ok(f.elements.since.value);state.data.meet=ok(f.elements.meet.value);await persist();render();
  }else if(f.dataset.form==='ritual'){
    e.preventDefault();
    const t=f.elements.text.value.trim();
    if(t){state.data.rituals.push({id:uid(),text:t,days:{}});await persist();render();}
  }else if(f.dataset.form&&COLLECTIONS[f.dataset.form]){
    e.preventDefault();
    const name=f.dataset.form,text=f.elements.text.value.trim();
    if(!text)return;
    const entry={id:uid(),text:text,ts:Date.now()};
    if(f.elements.when&&f.elements.when.value)entry.when=f.elements.when.value;
    if(COLLECTIONS[name].check)entry.done=false;
    state.data[name].push(entry);
    await persist();render();
  }
}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy nahi hua'));
  else toast('Copy nahi hua, code khud likh lein');
}
function genCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(10));let s='';
  for(let i=0;i<10;i++)s+=A[r[i]%A.length];
  return s.slice(0,5)+'-'+s.slice(5);
}
function shareLink(){return location.origin+location.pathname+'#room='+encodeURIComponent(state.data.room||'');}

async function handleClick(e){
  const t=e.target;
  const tb=t.closest('[data-tab]');
  if(tb){state.tab=tb.dataset.tab;render();window.scrollTo(0,0);return;}
  const js=t.closest('[data-jsub]');
  if(js){state.jsub=js.dataset.jsub;render();return;}
  const ts=t.closest('[data-tsub]');
  if(ts){state.tsub=ts.dataset.tsub;$('tgtabs').innerHTML=tgTabsHtml();updateContent();return;}
  if(t.id==='a-reset'){
    e.preventDefault();
    if(confirm('Is device ka vault permanently erase hoga. Continue?')){localStorage.removeItem(LS_KEY);setMsg(null);render();}
    return;
  }
  const b=t.closest('[data-act]');
  if(!b)return;
  const act=b.dataset.act,d=state.data;
  if(act==='lock')lock();
  else if(act==='toggle-challenge'){const k=todayKey();if(d.done[k])delete d.done[k];else d.done[k]=true;await persist();render();}
  else if(act==='rit'){d.rituals.forEach(r=>{if(r.id===b.dataset.id){const k=todayKey();if(r.days[k])delete r.days[k];else r.days[k]=true;}});await persist();render();}
  else if(act==='rit-del'){if(confirm('Ye ritual delete karein?')){d.rituals=d.rituals.filter(r=>r.id!==b.dataset.id);await persist();render();}}
  else if(act==='del'){if(!confirm('Delete this entry?'))return;const c=b.dataset.col;d[c]=d[c].filter(x=>x.id!==b.dataset.id);await persist();render();}
  else if(act==='tick'){d[b.dataset.col].forEach(x=>{if(x.id===b.dataset.id)x.done=!x.done;});await persist();render();}
  else if(act==='export'){
    const rec=localStorage.getItem(LS_KEY);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([rec],{type:'application/json'}));
    a.download='humtum-backup-'+todayKey()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
  else if(act==='clear-chat'){if(confirm('Saari chat history is device se delete karein?')){d.chat=[];await persist();setMsg('Chat clear ho gayi.','ok');render();}}
  else if(act==='gen'){const el=document.querySelector('#f-connect [name=code]');if(el)el.value=genCode();}
  else if(act==='disconnect'){N.stop();state.starting=false;state.netErr='';d.auto=false;persist();refreshNet();}
  else if(act==='retry'){N.kick();toast('Dobara try kar raha hoon...');}
  else if(act==='copy')copyText(d.room||'');
  else if(act==='wa'){
    const link=shareLink();
    const text='Hum Tum par aao 💞\n'+link+'\nCode: '+(d.room||'');
    window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  }
  else if(act==='ping'){const em=PINGS.indexOf(b.dataset.e)>-1?b.dataset.e:PINGS[0];sendMsg({t:'ping',e:em});toast('Sent '+em);}
  else if(act==='g-open')startGame(b.dataset.g);
  else if(act==='g-close'){state.game=null;state.gtmp=null;sendMsg({t:'gc'});gameChanged();}
  else if(act==='ttt')tttMove(parseInt(b.dataset.i,10));
  else if(act==='c4')c4Drop(parseInt(b.dataset.c,10));
  else if(act==='g-again'){if(state.game&&state.game.id==='ttt')tttAgain();else c4Again();}
  else if(act==='tod'){
    const k=b.dataset.k==='dare'?'dare':'truth';
    setGame({id:'tod',kind:k,i:Math.floor(Math.random()*(k==='dare'?DARES.length:TRUTHS.length))});
  }
  else if(act==='ans'){
    const g=state.game;if(!g||!DECKS[g.id])return;
    const type=DECKS[g.id].type,v=b.dataset.v;
    if(type==='choice')answer(parseInt(v,10));
    else if(type==='yom'){if(myRole())answer(v==='me'?myRole():otherRole());}
    else if(type==='guess'){
      if(state.gtmp===null){state.gtmp=parseInt(v,10);gameChanged();}
      else{const own=state.gtmp;state.gtmp=null;answer({own:own,guess:parseInt(v,10)});}
    }
  }
  else if(act==='g-next'){
    const g=state.game;
    if(g&&DECKS[g.id]&&g.ans.host!==null&&g.ans.guest!==null){sendMsg({t:'next',pos:g.pos});nextRound();}
  }
  else if(act==='dcol'){
    state.dcol=parseInt(b.dataset.i,10)||0;
    document.querySelectorAll('.sw').forEach((el,i)=>el.classList.toggle('on',i===state.dcol));
  }
  else if(act==='dclear'){state.strokes=[];if(state.drawClear)state.drawClear();sendMsg({t:'dc'});}
  else if(act==='dsave'){
    const cv=$('cv');if(!cv)return;
    const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='humtum-drawing.png';
    document.body.appendChild(a);a.click();a.remove();
  }
  else if(act==='qzp'){
    const g=state.game;
    if(!g||g.id!=='qz'||g.phase!=='answer'||g.by===myRole())return;
    const i=parseInt(b.dataset.i,10);if(!(i>=0&&i<g.opts.length))return;
    sendMsg({t:'qzp',n:g.n,i:i});
    applyPick(i,myRole());gameChanged();
  }
  else if(act==='qzn'){
    const g=state.game;
    if(g&&g.id==='qz'&&g.phase==='done'){sendMsg({t:'qzn',n:g.n});qzNext();}
  }
}

async function handleChange(e){
  if(e.target.id!=='f-import')return;
  const file=e.target.files[0];if(!file)return;
  try{
    const rec=JSON.parse(await file.text());
    if(!validRecord(rec))throw new Error('Ye Hum Tum backup file nahi hai.');
    const pass=prompt('Is backup ka passphrase likhein:');
    if(!pass){e.target.value='';return;}
    const r=await decryptRecord(rec,pass);
    N.stop();
    localStorage.setItem(LS_KEY,JSON.stringify(rec));
    state.key=r.key;state.salt=r.salt;state.iter=r.iter;state.data=r.data;state.tab='vault';
    setMsg('Backup restore ho gaya.','ok');render();autoStart();
  }catch(err){
    setMsg(err.message&&err.message.indexOf('backup file')>-1?err.message:'Restore nahi hua: galat passphrase ya kharab file.');
    if(state.key){state.tab='vault';render();}else lockView();
  }
}
function handleInput(e){
  const t=e.target;
  if(t.id==='chat-in')state.chatDraft=t.value;
  else if(t.id==='deep-in')state.draft=t.value;
  else if(t.closest&&t.closest('#f-qz')){
    const f=$('f-qz');
    if(f){const c=parseInt(f.elements.c.value,10);state.qzd={q:f.elements.q.value,o:[0,1,2,3].map(i=>f.elements['o'+i].value),c:(c>=0&&c<4)?c:-1};}
  }
}

document.addEventListener('submit',handleSubmit);
document.addEventListener('click',handleClick);
document.addEventListener('change',e=>{handleChange(e);if(e.target.closest&&e.target.closest('#f-qz'))handleInput(e);});
document.addEventListener('input',handleInput);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)state.hid=Date.now();
  else if(state.key){
    if(state.hid&&Date.now()-state.hid>10*60*1000){lock();return;}
    if(N.active())N.kick();
  }
});
setInterval(()=>{if(state.key&&state.tab==='together'&&N.active()){const a=$('netbar');if(a)a.innerHTML=netBarHtml();}},3000);

setInterval(()=>{const c=$('clk');if(c)c.innerHTML=clkHtml();},20000);
try{const m=/room=([^&]+)/.exec(location.hash);if(m)state.roomHint=decodeURIComponent(m[1]).slice(0,40);}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');}catch(e){}
render();
})();
</script>
